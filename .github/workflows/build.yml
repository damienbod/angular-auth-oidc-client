name: Build, Lint & Test Lib

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_job:
    runs-on: ubuntu-latest
    name: Built, Lint and Test Library
    permissions:
      # Needed to push the coverage badge to the 'badges' branch on main.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses:  actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installing Dependencies
        run: npm ci

      - name: Linting Library
        run: npm run lint-lib

      - name: Testing Frontend
        run: npm run test-lib-ci

      - name: Coverage summary
        run: node ./tools/coverage-badge.js

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ./tools/coverage-badge.js "$RUNNER_TEMP/badges/coverage.json"
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "coverage badge for ${GITHUB_SHA::8}"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

      - name: Building Frontend
        run: npm run build-lib-prod

      - name: Copying essential additional files
        run: npm run copy-files

      - name: Testing Schematics
        run: npm run test-schematics

      - name: Upload Artefact
        uses: actions/upload-artifact@v4
        with:
          name: angular_auth_oidc_client_artefact
          path: dist/angular-auth-oidc-client

  AngularScaffold:
    needs: build_job
    runs-on: ubuntu-latest
    name: Angular latest & Schematics Job (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ng_new: options for 'ng new'. extra: options for 'ng add'.
          # Without 'extra', ng add auto-detects standalone vs. NgModule.
          - name: standalone-refresh
            ng_new: ''
            flow: 'OIDC Code Flow PKCE using refresh tokens'
            extra: ''
          - name: standalone-default
            ng_new: ''
            flow: 'Default config'
            extra: ''
          - name: ngmodule-refresh
            ng_new: '--standalone=false'
            flow: 'OIDC Code Flow PKCE using refresh tokens'
            extra: ''
          - name: ngmodule-standalone-opt
            ng_new: '--standalone=false'
            flow: 'Default config'
            extra: '--standalone'
          - name: ngmodule-legacy
            ng_new: '--standalone=false'
            flow: 'Default config'
            extra: '--legacy-modules'
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node 24 for its npm 11. The npm 10 of Node 22 crashes while
          # installing the packages of the scaffolded app, when it resolves the
          # peer set of the vitest dev dependency the Angular CLI now adds:
          # "npm error Cannot read properties of null (reading 'edgesOut')".
          node-version: 24

      - name: Download Artefact
        uses: actions/download-artifact@v4
        with:
          name: angular_auth_oidc_client_artefact
          path: angular-auth-oidc-client-artefact

      - name: Install AngularCLI globally
        run: npm install -g @angular/cli

      - name: Show ng Version
        run: ng version

      - name: Create Angular Project
        run: ng new angular-auth-oidc-client-test --skip-git ${{ matrix.ng_new }}

      - name: Npm Install & Install Library from local artefact
        run: |
          cp -R angular-auth-oidc-client-artefact angular-auth-oidc-client-test/
          cd angular-auth-oidc-client-test
          npm install
          ng add ./angular-auth-oidc-client-artefact --authority-url-or-tenant-id "my-authority-url" --flow-type "${{ matrix.flow }}" --use-local-package=true --skip-confirmation ${{ matrix.extra }}

      - name: Test Angular Application
        working-directory: ./angular-auth-oidc-client-test
        run: npm test

      - name: Build Angular Application
        working-directory: ./angular-auth-oidc-client-test
        run: npm run build
