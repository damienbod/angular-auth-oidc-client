name: Build, Lint & Test Lib

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_job:
    runs-on: ubuntu-latest
    name: Built, Lint and Test Library
    permissions:
      # Needed to push the coverage badge to the 'badges' branch on main.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installing Dependencies
        run: npm ci

      - name: Linting Library
        run: npm run lint-lib

      - name: Checking Formatting
        run: npm run check-prettier

      - name: Checking Blockwords
        run: npm run check-blockwords

      - name: Testing Frontend
        run: npm run test-lib-ci

      - name: Coverage summary
        run: node ./tools/coverage-badge.js

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ./tools/coverage-badge.js "$RUNNER_TEMP/badges/coverage.json"
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "coverage badge for ${GITHUB_SHA::8}"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

      - name: Building Frontend
        run: npm run build-lib-prod

      - name: Copying essential additional files
        run: npm run copy-files

      - name: Testing Schematics
        run: npm run test-schematics

      # The integration tests import the library from dist/, so they run
      # after the build, against the local test IDP server.
      - name: Installing Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Starting Test IDP Server
        working-directory: projects/integration-tests/test-idp-server
        run: |
          npm ci
          ./start.sh

      - name: Running Integration Tests
        run: npm run test-integration

      - name: Stopping Test IDP Server
        if: always()
        working-directory: projects/integration-tests/test-idp-server
        run: ./stop.sh

      - name: Upload Artefact
        uses: actions/upload-artifact@v4
        with:
          name: angular_auth_oidc_client_artefact
          path: dist/angular-auth-oidc-client

  e2e_samples:
    runs-on: ubuntu-latest
    name: List E2E Samples
    outputs:
      samples: ${{ steps.list.outputs.samples }}
    steps:
      - uses: actions/checkout@v5

      - id: list
        run: echo "samples=$(jq -c '[.[].name]' e2e/samples.json)" >> "$GITHUB_OUTPUT"

  # Runs every sample in e2e/samples.json in a real browser against the local
  # test IDP server, one job per sample.
  e2e_job:
    needs: e2e_samples
    runs-on: ubuntu-latest
    name: E2E Tests (${{ matrix.sample }})
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(needs.e2e_samples.outputs.samples) }}
    env:
      E2E_SAMPLES: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installing Dependencies
        run: npm ci

      - name: Installing Test IDP Server Dependencies
        run: npm ci --prefix projects/integration-tests/test-idp-server

      - name: Installing Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The samples import the library from dist/.
      - name: Building Library
        run: npm run build-lib

      - name: Running E2E Tests
        run: npm run e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.sample }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  AngularScaffold:
    needs: build_job
    runs-on: ubuntu-latest
    name: Angular ${{ matrix.ng }} & Schematics Job (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ng: Angular CLI version. ng_new: options for 'ng new'.
          # extra: options for 'ng add'. Without 'extra', ng add
          # auto-detects standalone vs. NgModule.
          # test_args: Angular 20 apps use Karma, which watches by default.
          - name: standalone-refresh
            ng: latest
            ng_new: ''
            flow: 'OIDC Code Flow PKCE using refresh tokens'
            extra: ''
            test_args: ''
          - name: standalone-default
            ng: latest
            ng_new: ''
            flow: 'Default config'
            extra: ''
            test_args: ''
          - name: ngmodule-refresh
            ng: latest
            ng_new: '--standalone=false'
            flow: 'OIDC Code Flow PKCE using refresh tokens'
            extra: ''
            test_args: ''
          - name: ngmodule-standalone-opt
            ng: latest
            ng_new: '--standalone=false'
            flow: 'Default config'
            extra: '--standalone'
            test_args: ''
          - name: ngmodule-legacy
            ng: latest
            ng_new: '--standalone=false'
            flow: 'Default config'
            extra: '--legacy-modules'
            test_args: ''
          # Minimum supported version, see the @angular/core peer dependency.
          - name: min-standalone-refresh
            ng: 20
            ng_new: ''
            flow: 'OIDC Code Flow PKCE using refresh tokens'
            extra: ''
            test_args: '-- --watch=false --browsers=ChromeHeadless'
    steps:
      # This job doesn't build the repo, so fetch just the .nvmrc.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node 24 (.nvmrc) for its npm 11. The npm 10 of Node 22 crashes
          # while installing the packages of the scaffolded app, when it
          # resolves the peer set of the vitest dev dependency the Angular CLI
          # now adds: "npm error Cannot read properties of null (reading
          # 'edgesOut')".
          node-version-file: .nvmrc

      - name: Download Artefact
        uses: actions/download-artifact@v4
        with:
          name: angular_auth_oidc_client_artefact
          path: angular-auth-oidc-client-artefact

      - name: Create Angular Project
        run: npx -y @angular/cli@${{ matrix.ng }} new angular-auth-oidc-client-test --skip-git ${{ matrix.ng_new }}

      - name: Show ng Version
        working-directory: ./angular-auth-oidc-client-test
        run: npx ng version

      - name: Npm Install & Install Library from local artefact
        run: |
          cp -R angular-auth-oidc-client-artefact angular-auth-oidc-client-test/
          cd angular-auth-oidc-client-test
          npm install
          npx ng add ./angular-auth-oidc-client-artefact --authority-url-or-tenant-id "my-authority-url" --flow-type "${{ matrix.flow }}" --use-local-package=true --skip-confirmation ${{ matrix.extra }}

      - name: Test Angular Application
        working-directory: ./angular-auth-oidc-client-test
        run: npm test ${{ matrix.test_args }}

      - name: Build Angular Application
        working-directory: ./angular-auth-oidc-client-test
        run: npm run build
