name: Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let a running deploy finish; a newer push queues behind it.
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Docs Job
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/site/angular-auth-oidc-client/package-lock.json

      - name: Installing Dependencies for docs - in docs folder
        run: npm ci
        working-directory: docs/site/angular-auth-oidc-client

      - name: Building Documentation
        run: npm run build
        working-directory: docs/site/angular-auth-oidc-client

      - name: Build And Deploy
        # Skip on forks; branch protection controls who can push to main.
        if: github.repository == 'damienbod/angular-auth-oidc-client'
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: 'upload'
          ###### Repository/Build Configurations - These values can be configured to match you app requirements. ######
          app_location: '/docs/site/angular-auth-oidc-client' # App source code path
          app_artifact_location: 'build' # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
